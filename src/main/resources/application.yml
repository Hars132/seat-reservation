server:
  port: ${PORT:8080}
  shutdown: graceful
  tomcat:
    threads:
      max: 200
    accept-count: 8192        # queue of connections waiting for a thread: absorbs the stampede
    max-connections: 20000

spring:
  application:
    name: seat-reservation
  lifecycle:
    timeout-per-shutdown-phase: 20s
  jackson:
    property-naming-strategy: SNAKE_CASE   # API uses snake_case everywhere (price_paise, user_id...)
    deserialization:
      accept-float-as-int: false           # price_paise: 250.5 must be a 400, never truncated to 250
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/seats?reWriteBatchedInserts=true}
    username: ${DB_USER:seats}
    password: ${DB_PASSWORD:seats}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: ${DB_POOL_SIZE:20}   # fixed-size pool: no resize latency during the stampede
      connection-timeout: 10000
      # Safety nets on every connection: no lock wait or query may hang forever and starve the pool.
      connection-init-sql: "SELECT set_config('lock_timeout','5s',false), set_config('statement_timeout','20s',false)"
  flyway:
    enabled: true

app:
  jwt:
    # HS256 key, must be >= 32 bytes. Set JWT_SECRET in any real deployment.
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
    ttl-seconds: ${JWT_TTL_SECONDS:43200}
  admin:
    # Presented to POST /auth/token to receive an ADMIN token. Documented in the README.
    secret: ${ADMIN_SECRET:admin-secret-change-me}
  reserve:
    # Max reserve transactions in flight. MUST be <= DB pool size so excess requests wait here
    # (cheap, in memory) instead of timing out inside Hikari (which would surface as a 5xx).
    max-concurrency: ${RESERVE_MAX_CONCURRENCY:16}
    queue-timeout-ms: 20000

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
